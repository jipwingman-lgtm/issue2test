[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue2test"
version = "0.1.0"
description = "Generate pytest regression tests from bug reports using OpenAI coding models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Issue2Test contributors"}]
dependencies = [
  "openai>=1.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
issue2test = "issue2test.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
